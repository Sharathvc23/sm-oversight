name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # sm-oversight 0.3 needs sm-arp 0.4.0 (one detached-witness canonicalization
      # rule). PyPI still serves 0.3.4, so install the 0.4.0 merge commit first;
      # the pin in pyproject then resolves against it. Drop this step once 0.4.0
      # is published.
      - run: pip install "git+https://github.com/Sharathvc23/sm-arp@f182c0c07556147d57548945f1a3b00088138aad"
      - run: pip install -e ".[dev]"
      - run: ruff check sm_oversight tests
      - run: mypy sm_oversight
      - run: coverage run -m pytest && coverage report
