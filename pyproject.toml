[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-oversight"
version = "0.3.0"
description = "Human oversight protocol — signed approve/deny/escalate gestures with M-of-N quorum, as an auditable ARP receipt chain"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "stellarminds.ai" }]
keywords = ["nanda", "oversight", "human-in-the-loop", "eu-ai-act", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    # sm-arp is a REAL dependency, not vendored. It was vendored when sm-arp was
    # not on PyPI; it is now published, and shipping our own copy of sm_arp in the
    # wheel collided with the real distribution over the same import path (last
    # install silently wins) while pinning consumers to a frozen v0.1.3.
    # cryptography / base58 / jcs are sm-arp's own transitive deps — declared by
    # it, not restated here.
    # >= 0.4.0: canonical_bytes/chain_link detach evidence.witness_signatures (so a
    # witness never invalidates the issuer signature), detach_witnesses is public,
    # vrp reads both witness_did and signer_did, verify_authority_chain
    # authenticates the grant. quorum.py relies on every one of those.
    "sm-arp>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/Sharathvc23/sm-oversight"
Spec = "https://github.com/Sharathvc23/sm-oversight/blob/main/SPEC.md"
Whitepaper = "https://github.com/Sharathvc23/sm-oversight/blob/main/WHITEPAPER.md"
Changelog = "https://github.com/Sharathvc23/sm-oversight/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "coverage>=7.0",
]

[tool.hatch.build.targets.wheel]
# Ship ONLY our own package. Shipping a second top-level `sm_arp` made this wheel
# and the real sm-arp distribution fight over one import path.
packages = ["sm_oversight"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.lint.isort]
# sm-arp is a third-party PyPI dependency. Stated explicitly because ruff
# otherwise infers it as first-party and sorts it into our own import block —
# it used to be vendored in-tree, and an import order that still implies that
# is the packaging mistake this repo just removed, written down.
known-third-party = ["sm_arp"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sm_oversight"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[[tool.mypy.overrides]]
# Transitive deps of sm-arp that ship no type stubs — treat their imports as
# untyped rather than failing strict mode on missing stubs.
module = ["jcs", "base58"]
ignore_missing_imports = true
